<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Eschaton, the Enfield Tennis Academy's tennis-court thermonuclear war game, in the browser."
    />
    <title>Eschaton</title>
  </head>
  <body>
    <main id="theater"></main>
    <header class="masthead">
      <h1>Eschaton</h1>
      <p>East Courts, Enfield Tennis Academy. <span id="court-list"></span></p>
      <p>Click a garment to see what it is. Drag to turn, scroll to zoom, or use the arrow keys.</p>
      <label class="viewer-pick"
        >Viewing as
        <select id="viewer">
          <option value="gm">Game-master</option>
        </select>
      </label>
      <div class="toolbar">
        <label class="finder"
          >Find on the courts
          <select id="finder">
            <option value="">Choose a garment or player</option>
          </select>
        </label>
        <button type="button" id="open-rulebook">Rulebook</button>
        <button type="button" id="open-intro">Introduction</button>
        <button type="button" id="sound-toggle" aria-pressed="true">Sound on</button>
      </div>
    </header>
    <p id="announcer" class="sr-only" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
